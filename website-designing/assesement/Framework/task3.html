<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- js file -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Create a form with Bootstrap floating-label inputs for Full Name, Mobile Number, and Delivery
Address (textarea, minimum 3 rows).

Add a select dropdown for Delivery Time Slot with at least four time options (e.g. Now, Within 30
min, 12:00–1:00 PM, 1:00–2:00 PM).

Apply validation classes so that empty or incorrectly filled fields display the is-invalid state
with a descriptive red feedback message, and correctly filled fields show the is-valid state with
a green confirmation message.

Style the form container using Bootstrap utility classes only (mt-4, p-4, rounded, shadow-sm,
bg-light) — no custom CSS. -->
<div class="container mt-4 p-4 rounded shadow-sm bg-light">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <form class="row g-3 needs-validation" novalidate>
    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
        <label for="fullName">Full Name</label>
        <div class="invalid-feedback">
            Please enter your full name.
          </div>
          <div class="valid-feedback">
            Full name looks good!
          </div>
    </div>

        <div class="form-floating mb-3">
        <input type="tel" class="form-control" id="mobileNumber" placeholder="Mobile Number" required>
        <label for="mobileNumber">Mobile Number</label>
        <!-- <label for="validationCustom01" class="form-label">MobileNumber</label> -->
        <div class="invalid-feedback">
            Please enter a valid 10-digit mobile number.
          </div>
          <div class="valid-feedback">
            Mobile number is valid!
          </div>
        </div>


        <div class="form-floating mb-3"> 
        <textarea class="form-control" id="deliveryAddress" placeholder="Delivery Address" rows="3" required
            style="height: 100px;"></textarea>
        <label for="deliveryAddress">Delivery Address</label>
        <div class="invalid-feedback">
            Please enter a valid delivery address (at least 10 characters).
          </div>
          <div class="valid-feedback">
            Delivery address looks good!
          </div>
    </div>
        </form>

        <div class="form-floating mb-3">
            <select class="form-select" id="deliveryTime" required>
              <option value="" selected disabled>Select a time slot</option>
              <option value="now">Now</option>
              <option value="30-min">Within 30 min</option>
              <option value="12-1">12:00-1:00 PM</option>
              <option value="1-2">1:00-2:00 PM</option>
            </select>
            <label for="deliveryTime">Delivery Time Slot</label>
            <div class="invalid-feedback">
                Please select a delivery time slot.
              </div>
              <div class="valid-feedback">
                Delivery time slot selected!
              </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            Submit
          </button>


</body>

</html>
