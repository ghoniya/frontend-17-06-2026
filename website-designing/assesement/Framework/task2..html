<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- js file -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
    <style>
        .container {
            display: inline-block;
            display: flex;
            flex-wrap: wrap;
        }

        .container ul li {
            display: inline-block;
            padding: 0px 10px;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: none;
            }

            .nav-link{
                 display: none; 
                 flex-direction: row;
                margin: 0;
                gap: 20px; 
            }
        } 
    </style>

</head>

<body>
    <!-- Create a dark Bootstrap navbar with the brand name 'QuickEats', navigation links (Home,
Menu, Offers, Track Order), and a Cart button styled with a badge showing a numeric item
count.
Add the correct navbar-toggler button and data-bs-target attribute so all navigation links
collapse into a hamburger icon on screens narrower than 768px.

Below the navbar, build a Bootstrap carousel with at least three slides — each containing a
promotional heading (e.g. '50% off your first order'), a brief description, and a 'Claim Offer' CTA
button.
Configure the carousel to auto-advance every 4 seconds and display both previous and next
navigation controls. -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
        <div class="container">
            <a class="navbar-brand fw-bold " href="#">QuickEats</a>
            <button class="menu-toggle d-none" aria-label="Open menu" >☰</button>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li><a class="nav-link" href="#">Home</a></li>
                <li> <a class="nav-link" href="#">Menu</a></li>
                <li><a class="nav-link" href="#">Offers</a></li>
                <li><a class="nav-link" href="#">Track Order</a>
                </li>
            </ul>
        </div>
        <button type="button" class="btn btn-primary position-relative"> Cart
            <span class="badge badge-sm bg-success text-white rounded-pill">2
            </span>
        </button>
    </nav>
    <div id="carouselExampleIndicators" class="carousel slide  mt-2" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"
                aria-label="Slide 4"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://www.shutterstock.com/image-vector/burger-special-offer-50-percent-260nw-2683426213.jpg"
                    class="d-block w-100" style="width: 100%; height: 600px;" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjPzs95vqIYoOVmqDsLxaMkwrg2yYiNYHx6WZp42hkxg&s=10"
                    class="d-block w-100" alt="..." style="width: 100%; height: 600px;">
            </div>
            <div class="carousel-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRb0KGkeOQ-wQqjFyyElVAixoy_uPJHrfsaYu4unKiEJ8gZId6aQT6cBgQ&s=10"
                    class="d-block w-100" alt="..." style="width: 100%; height: 600px;">
            </div>
            <div class="carousel-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjjq7O2oa5JA09MTtnRi2fQwKJrB1_TPMI7ZDlE8pxUSgZ83xbL6UG0iI&s=10"
                    class="d-block w-100" alt="..." style="width: 100%; height: 600px;">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    </div>
    </div>

</body>

</html>
