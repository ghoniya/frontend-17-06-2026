<!-- Create an array named playlist containing 5 of your favorite songs, then use a for loop to print each song name in the console. -->

<script>
    // Create an array of 5 favorite songs
let playlist = [
    "Shape of You",
    "Perfect",
    "Believer",
    "Love Me Like You Do",
    "Tum Hi Ho"
];

 // Print each song using a for loop
for (let i = 0; i < playlist.length; i++) {
    console.log(playlist[i]);
}
</script>
