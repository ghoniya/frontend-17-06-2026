<!-- Given an array of food items from Zomato like ['Pizza', 'Burger', 'Dosa', 'Pasta', 'Biryani'], use the slice() method to create a new array with only the 2nd, 3rd, and 4th items, then log the result.<br><br><em><strong>Hint:</strong> Remember that array indexes start from 0.</em> -->
 <script>
    let foodItems = ['Pizza', 'Burger', 'Dosa', 'Pasta', 'Biryani'];

// Get the 2nd, 3rd, and 4th items
let selectedItems = foodItems.slice(1, 4);

console.log(selectedItems);
 </script>
