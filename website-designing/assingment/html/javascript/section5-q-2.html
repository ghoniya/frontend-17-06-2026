<!-- Write an arrow function called getGreeting that takes a user's name as a parameter and returns a message like 'Hello, Rahul!'. Test it by passing your own name and log the result to the console. -->
<script>
const getGreeting = (name) => {
    return `Hello, ${name}!`;
};

// Test the function
console.log(getGreeting("Taslim"));
</script>
