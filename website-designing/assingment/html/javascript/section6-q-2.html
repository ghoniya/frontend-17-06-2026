<!-- Declare an array called playlist containing 5 song names (strings). Use push() to add a new song and pop() to remove the last song, then log the updated array after each operation. -->
 <script>
    // Create an array containing 5 song names
let playlist = [
    "Perfect",
    "Shape of You",
    "Believer",
    "Levitating",
    "Senorita"
];

// Add a new song using push()
playlist.push("Faded");
console.log("After adding a song:", playlist);

// Remove the last song using pop()
playlist.pop();
console.log("After removing a song:", playlist);
 </script>
