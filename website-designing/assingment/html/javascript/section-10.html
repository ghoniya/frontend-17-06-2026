<!-- Create an HTML file with a 'Feedback' form containing fields for Name, Email, and Message, and a Submit button. On submission, prevent the default action and log the entered data as an object in the console.

2.Add JavaScript validation to your 'Feedback' form so that the Name field is required and the Email field must match a basic email pattern (e.g., user@example.com). If validation fails, display an error message below the relevant field.

3.Show a green success message at the top of your form when all fields pass validation and the form is submitted.

4.Use ChatGPT to suggest an improved regex pattern for email validation in your form, then update your JavaScript code to use the new pattern. Paste the suggested regex as a comment above your validation code. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 30px;
        }

        .feedback-form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #2874f0;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #2874f0;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #1558b0;
        }
    </style>
</head>
<body>

    <div class="feedback-form">
        <h2>Feedback Form</h2>

        <form id="feedbackForm">
            <label for="name">Name:</label>
            <input type="text" id="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="message">Message:</label>
            <textarea id="message" rows="4" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        let form = document.getElementById("feedbackForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let feedback = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                message: document.getElementById("message").value
            };

            

        let name = document.getElementById("name").value.trim();
                let email = document.getElementById("email").value.trim();

                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                let isValid = true;

                // Clear previous messages
                document.getElementById("nameError").innerHTML = "";
                document.getElementById("emailError").innerHTML = "";
                document.getElementById("successMessage").innerHTML = "";

                // Validate Name
                if (name === "") {
                    document.getElementById("nameError").innerHTML =
                        "Name is required.";
                    isValid = false;
                }

                // Validate Email
                if (email === "") {
                    document.getElementById("emailError").innerHTML =
                        "Email is required.";
                    isValid = false;
                } else if (!emailPattern.test(email)) {
                    document.getElementById("emailError").innerHTML =
                        "Please enter a valid email, e.g. user@example.com.";
                    isValid = false;
                } else {
                 document.getElementById("emailError").innerHTML = "";
}

                // // Display success message
                // if (isValid) {
                //     document.getElementById("successMessage").innerHTML =
                //         "Feedback submitted successfully!";
                // }
                 // Show success message at the top
                 if (isValid) {
                    document.getElementById("successMessage").hidden = false;
                }
            });
                
    </script>

</body>
</html>
