<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
    integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
    crossorigin="anonymous"></script>
  <!-- 1.Create a responsive navbar for a food delivery website like Zomato using your chosen framework. The navbar should include links for Home, Restaurants, Orders, and Profile, and should collapse into a hamburger menu on mobile devices.

    2.Customize the navbar by adding a brand logo on the left and a search input in the center, similar to Flipkart's header. Make sure the search input is only visible on desktop screens.<br><br><em><strong>Hint:</strong> Use utility classes or custom CSS to hide/show elements based on screen size.</em>

   3.Set up a carousel component that displays three promotional images for a music streaming app homepage (like Spotify). Add controls to navigate to the next and previous slides.

   4.Add indicators (dots) below your carousel that show which slide is active and allow users to click on a dot to jump to that slide.<br><br><em><strong>Hint:</strong> Make sure the active indicator updates as the carousel changes slides automatically or via controls.</em> -->
</head>

<body>

  <button type="button" class="btn btn-sm bg-white text-black fs-5 navbar-toggler" data-bs-toggle="collapse"
    data-bs-target="#btnColl">
    <span class="bi bi-grid"></span>
  </button>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <!-- logo -->
    <a href="" class="navbar-brand text-dark fs-2 ms-5">Zomato</a>
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
          <a class="nav-link" href="#">Restaurants</a>
          <a class="nav-link" href="#">Orders</a>
          <a class="nav-link" href="#">Profile</a>

          <div class="container-fluid">
            <form class="d-flex">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </nav>

  <div id="carouselExampleCaptions" class="carousel slide cantainer mt-3" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGnysa4lHn5-TKuGe5U7eQSBFIItm-Rjg5vPfb--nUsQ&s=10"class="d-block w-100 ">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqeHzkdzSZF6Jn2KCOdsdH_rshXWn1vxiY2bJtOMRqMQ&s=10" class="d-block w-100 ">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://media.istockphoto.com/id/1328715166/vector/musical-notes-on-winding-lines-in-dark-starry-space.jpg?s=612x612&w=0&k=20&c=mG2KKBc279S_uJVe228iKBKibwqvhZdhAVw9cJw6hLI="class="d-block w-100">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  </div>

</body>

</html>
