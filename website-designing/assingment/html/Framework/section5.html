    <!-- 1.Create a simple profile card for a food delivery app using Bootstrap utility classes: add margin m-3, padding p-2, and set a background color using bg-primary.

2.Build a horizontal navigation bar like the one on Flipkart using display utility classes to align items in a row and add spacing between them with mx-2.

3.Show or hide a promotional banner (e.g., '20% OFF Today!') using Bootstrap's visibility utility classes so that it only appears on medium and larger screens.<br><br><em><strong>Hint:</strong> Use d-none d-md-block to control visibility at different breakpoints.</em>

4.Design a responsive grid of three movie posters (like BookMyShow) where each poster has different padding on mobile (p-1) and desktop (p-4) using Bootstrap spacing utilities. -->
<style>
    nav{
        display: flex;
        flex-wrap: wrap;
    }
    nav ul li{
        display: inline-block;
        text-decoration:none;
       
    }
    nav ul li a{
        text-decoration: none;
    }

</style>

<body>
    <!-- Q-1 -->
    <div class="card m-3 p-2 bg-primary text-white" style="max-width:320px;">
        <div class="card-body">
            <h5 class="card-title">Zomato</h5>
            <p class="card-text">Fresh meals delivered straight to your door.</p>
        </div>
    </div>
    <!-- Q-2 -->
    <nav class="d-flex align-items-center bg-dark p-2">

    <!-- q-3 -->
    <div class="d-none d-md-block bg-danger text-dark text-center p-3">
