      <!-- q-1 -->
     <div class="container">

        <div class="form-floating mb-3">
          <input type="text"class="form-control"id="username"placeholder="Username" required>

        </div>

        <!-- Password -->
        <div class="form-floating mb-3">

        </div>

          <button type="submit" class="btn btn-primary"> Login

        </div>
      </form>
    </div>
  </div>
